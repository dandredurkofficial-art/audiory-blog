<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Audiory Blog Dashboard</title>

  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getFirestore,
      collection,
      addDoc,
      serverTimestamp,
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      getStorage,
      ref,
      uploadBytes,
      getDownloadURL
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";


    // =========================
    // FIREBASE CONFIG
    // =========================

    const firebaseConfig = {
      apiKey: "AIzaSyCmsFTjDryYOTddWfScTKsnrs0cWAHnpdc",
      authDomain: "audiory-beat-store.firebaseapp.com",
      projectId: "audiory-beat-store",
      storageBucket: "audiory-beat-store.firebasestorage.app",
      messagingSenderId: "688272560511",
      appId: "1:688272560511:web:9031e6ce215d6f08764a4a"
    };

    // =========================
    // INIT
    // =========================

    const app = initializeApp(firebaseConfig);

    const db = getFirestore(app);

    const auth = getAuth(app);

    const storage = getStorage(app);

    let currentUser = null;


    // =========================
    // LOGIN
    // =========================

    async function login() {

      const email = document.getElementById("email").value;

      const password = document.getElementById("password").value;

      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      } catch (error) {

        alert(error.message);

      }

    }

    window.login = login;


    // =========================
    // AUTH CHECK
    // =========================

    onAuthStateChanged(auth, async (user) => {

      if (!user) {

        document.getElementById("loginBox").style.display = "flex";

        document.getElementById("editor").style.display = "none";

        return;

      }

      const adminRef = doc(db, "admins", user.uid);

      const adminSnap = await getDoc(adminRef);

      if (!adminSnap.exists()) {

        alert("You are not admin.");

        await signOut(auth);

        return;

      }

      currentUser = user;

      document.getElementById("loginBox").style.display = "none";

      document.getElementById("editor").style.display = "block";

    });


    // =========================
    // PUBLISH POST
    // =========================

    async function publishPost() {

      const title = document.getElementById("title").value;

      const excerpt = document.getElementById("excerpt").value;

      const content = document.getElementById("content").value;

      const thumbnailFile =
        document.getElementById("thumbnail").files[0];


      if (!title || !content) {

        alert("Please fill all required fields.");

        return;

      }


      const slug = title
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-");


      let thumbnailURL = "";


      // =========================
      // UPLOAD IMAGE
      // =========================

      if (thumbnailFile) {

        const imageRef = ref(
          storage,
          `blog-thumbnails/${Date.now()}-${thumbnailFile.name}`
        );

        await uploadBytes(imageRef, thumbnailFile);

        thumbnailURL = await getDownloadURL(imageRef);

      }


      // =========================
      // SAVE POST
      // =========================

      await addDoc(collection(db, "blogPosts"), {

        title,

        excerpt,

        content,

        slug,

        thumbnailURL,

        authorName: currentUser.email,

        authorId: currentUser.uid,

        createdAt: serverTimestamp(),

        published: true

      });


      alert("Blog post published successfully!");



      // CLEAR FORM

      document.getElementById("title").value = "";

      document.getElementById("excerpt").value = "";

      document.getElementById("content").value = "";

      document.getElementById("thumbnail").value = "";

    }

    window.publishPost = publishPost;

  </script>


  <style>

    *{
      box-sizing:border-box;
    }

    body{

      margin:0;

      background:#050816;

      color:white;

      font-family:Arial;

      padding:20px;

    }

    h1{

      margin-bottom:20px;

      font-size:32px;

    }

    input,
    textarea{

      width:100%;

      margin-bottom:15px;

      padding:14px;

      border:none;

      border-radius:14px;

      background:#111827;

      color:white;

      font-size:16px;

    }

    textarea{

      min-height:300px;

      resize:vertical;

    }

    button{

      background:white;

      color:black;

      border:none;

      padding:14px 20px;

      border-radius:14px;

      font-weight:bold;

      cursor:pointer;

      font-size:16px;

    }

    #loginBox{

      display:flex;

      flex-direction:column;

      max-width:400px;

      margin:100px auto;

      gap:12px;

    }

    #editor{

      display:none;

      max-width:900px;

      margin:auto;

    }

    .uploadLabel{

      margin-bottom:8px;

      display:block;

      color:#9ca3af;

    }

  </style>

</head>
<body>


  <!-- LOGIN -->

  <div id="loginBox">

    <h1>Admin Login</h1>

    <input
      id="email"
      type="email"
      placeholder="Admin email"
    />

    <input
      id="password"
      type="password"
      placeholder="Password"
    />

    <button onclick="login()">
      Login
    </button>

  </div>



  <!-- EDITOR -->

  <div id="editor">

    <h1>Publish Blog Post</h1>


    <input
      id="title"
      placeholder="Post title"
    />


    <input
      id="excerpt"
      placeholder="Short excerpt"
    />


    <label class="uploadLabel">
      Featured Thumbnail
    </label>

    <input
      type="file"
      id="thumbnail"
      accept="image/*"
    />


    <textarea
      id="content"
      placeholder="Write your article..."
    ></textarea>


    <button onclick="publishPost()">
      Publish Post
    </button>

  </div>

</body>
</html>
