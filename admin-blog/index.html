<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Audiory Blog Dashboard</title>

  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getFirestore,
      collection,
      addDoc,
      serverTimestamp,
      doc,
      getDoc,
      getDocs,
      orderBy,
      query,
      deleteDoc,
      updateDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      getStorage,
      ref,
      uploadBytes,
      getDownloadURL
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";


    // FIREBASE CONFIG

    const firebaseConfig = {

      apiKey: "AIzaSyCmsFTjDryYOTddWfScTKsnrs0cWAHnpdc",

      authDomain: "audiory-beat-store.firebaseapp.com",

      projectId: "audiory-beat-store",

      storageBucket: "audiory-beat-store.firebasestorage.app",

      messagingSenderId: "688272560511",

      appId: "1:688272560511:web:9031e6ce215d6f08764a4a"

    };


    // INIT

    const app = initializeApp(firebaseConfig);

    const db = getFirestore(app);

    const auth = getAuth(app);

    const storage = getStorage(app);

    let currentUser = null;

    let editingPostId = null;


    // LOGIN

    async function login() {

      const email = document.getElementById("email").value;

      const password = document.getElementById("password").value;

      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      } catch (error) {

        alert(error.message);

      }

    }

    window.login = login;


    // AUTH CHECK

    onAuthStateChanged(auth, async (user) => {

      if (!user) {

        document.getElementById("loginBox").style.display = "flex";

        document.getElementById("dashboard").style.display = "none";

        return;

      }

      const userRef = doc(db, "users", user.uid);

      const userSnap = await getDoc(userRef);

      if (!userSnap.exists()) {

        alert("User document not found.");

        await signOut(auth);

        return;

      }

      const userData = userSnap.data();

      if (!userData.isAdmin) {

        alert("You are not admin.");

        await signOut(auth);

        return;

      }

      currentUser = user;

      document.getElementById("loginBox").style.display = "none";

      document.getElementById("dashboard").style.display = "block";

      loadPosts();

    });


    // LOAD POSTS

    async function loadPosts() {

      const postsContainer =
        document.getElementById("postsContainer");

      postsContainer.innerHTML = "Loading posts...";

      const q = query(
        collection(db, "blogPosts"),
        orderBy("createdAt", "desc")
      );

      const snapshot = await getDocs(q);

      postsContainer.innerHTML = "";

      snapshot.forEach((docSnap) => {

        const post = docSnap.data();

        const div = document.createElement("div");

        div.className = "postCard";

        div.innerHTML = `

          <img
            src="${post.thumbnailURL || ''}"
            class="postThumb"
          />

          <div class="postInfo">

            <h3>${post.title}</h3>

            <p>${post.excerpt || ''}</p>

            <small>
              By ${post.authorName || 'Unknown'}
            </small>

            <br/>

            <small>
              ${post.createdAt?.toDate
                ? post.createdAt.toDate().toLocaleString()
                : ''}
            </small>

            <div class="postButtons">

              <button onclick="editPost('${docSnap.id}')">
                Edit
              </button>

              <button
                class="deleteBtn"
                onclick="deletePost('${docSnap.id}')"
              >
                Delete
              </button>

            </div>

          </div>

        `;

        postsContainer.appendChild(div);

      });

    }

    window.loadPosts = loadPosts;


    // DELETE POST

    async function deletePost(id) {

      const confirmDelete =
        confirm("Delete this post?");

      if (!confirmDelete) return;

      await deleteDoc(doc(db, "blogPosts", id));

      loadPosts();

    }

    window.deletePost = deletePost;


    // EDIT POST

    async function editPost(id) {

      editingPostId = id;

      const snap = await getDoc(doc(db, "blogPosts", id));

      const data = snap.data();

      document.getElementById("title").value =
        data.title || "";

      document.getElementById("excerpt").value =
        data.excerpt || "";

      document.getElementById("content").value =
        data.content || "";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }

    window.editPost = editPost;


    // PUBLISH OR UPDATE

    async function publishPost() {

      const title =
        document.getElementById("title").value;

      const excerpt =
        document.getElementById("excerpt").value;

      const content =
        document.getElementById("content").value;

      const thumbnailFile =
        document.getElementById("thumbnail").files[0];


      if (!title || !content) {

        alert("Fill all required fields.");

        return;

      }

      const slug = title
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-");


      let thumbnailURL = "";


      // IMAGE UPLOAD

      if (thumbnailFile) {

        const imageRef = ref(
          storage,
          `blog-thumbnails/${Date.now()}-${thumbnailFile.name}`
        );

        await uploadBytes(imageRef, thumbnailFile);

        thumbnailURL =
          await getDownloadURL(imageRef);

      }


      // UPDATE EXISTING

      if (editingPostId) {

        const updateData = {

          title,
          excerpt,
          content,
          slug

        };

        if (thumbnailURL) {

          updateData.thumbnailURL = thumbnailURL;

        }

        await updateDoc(
          doc(db, "blogPosts", editingPostId),
          updateData
        );

        alert("Post updated!");

        editingPostId = null;

      } else {

        // CREATE NEW

        await addDoc(collection(db, "blogPosts"), {

          title,
          excerpt,
          content,
          slug,
          thumbnailURL,

          authorName: currentUser.email,

          authorId: currentUser.uid,

          createdAt: serverTimestamp(),

          published: true

        });

        alert("Post published!");

      }


      // CLEAR FORM

      document.getElementById("title").value = "";

      document.getElementById("excerpt").value = "";

      document.getElementById("content").value = "";

      document.getElementById("thumbnail").value = "";

      loadPosts();

    }

    window.publishPost = publishPost;

  </script>


  <style>

    *{
      box-sizing:border-box;
    }

    body{

      margin:0;

      background:#050816;

      color:white;

      font-family:Arial;

    }

    .container{

      max-width:1200px;

      margin:auto;

      padding:20px;

    }

    .topBar{

      display:flex;

      justify-content:space-between;

      align-items:center;

      margin-bottom:30px;

      padding-bottom:20px;

      border-bottom:1px solid #1f2937;

    }

    h1{

      margin:0;

      font-size:32px;

    }

    .grid{

      display:grid;

      grid-template-columns:1fr 1fr;

      gap:20px;

    }

    .panel{

      background:#0f172a;

      border:1px solid #1e293b;

      border-radius:20px;

      padding:20px;

    }

    input,
    textarea{

      width:100%;

      margin-bottom:15px;

      padding:14px;

      border:none;

      border-radius:12px;

      background:#111827;

      color:white;

      font-size:15px;

    }

    textarea{

      min-height:250px;

      resize:vertical;

    }

    button{

      background:white;

      color:black;

      border:none;

      padding:12px 18px;

      border-radius:12px;

      font-weight:bold;

      cursor:pointer;

    }

    .deleteBtn{

      background:#ef4444;

      color:white;

    }

    .postCard{

      display:flex;

      gap:15px;

      background:#111827;

      border-radius:16px;

      padding:15px;

      margin-bottom:15px;

    }

    .postThumb{

      width:120px;

      height:120px;

      object-fit:cover;

      border-radius:12px;

      background:#1f2937;

    }

    .postInfo{

      flex:1;

    }

    .postButtons{

      display:flex;

      gap:10px;

      margin-top:15px;

    }

    #loginBox{

      display:flex;

      flex-direction:column;

      max-width:400px;

      margin:100px auto;

      gap:12px;

      padding:20px;

    }

    #dashboard{

      display:none;

    }

    @media(max-width:900px){

      .grid{

        grid-template-columns:1fr;

      }

      .postCard{

        flex-direction:column;

      }

      .postThumb{

        width:100%;

        height:220px;

      }

    }

  </style>

</head>
<body>


  <!-- LOGIN -->

  <div id="loginBox">

    <h1>Admin Login</h1>

    <input
      id="email"
      type="email"
      placeholder="Admin email"
    />

    <input
      id="password"
      type="password"
      placeholder="Password"
    />

    <button onclick="login()">
      Login
    </button>

  </div>



  <!-- DASHBOARD -->

  <div id="dashboard">

    <div class="container">

      <div class="topBar">

        <h1>Audiory Blog Dashboard</h1>

        <button onclick="location.reload()">
          Refresh
        </button>

      </div>


      <div class="grid">

        <!-- CREATE -->

        <div class="panel">

          <h2>Create / Edit Post</h2>

          <input
            id="title"
            placeholder="Post title"
          />

          <input
            id="excerpt"
            placeholder="Short excerpt"
          />

          <input
            type="file"
            id="thumbnail"
            accept="image/*"
          />

          <textarea
            id="content"
            placeholder="Write your article..."
          ></textarea>

          <button onclick="publishPost()">
            Publish Post
          </button>

        </div>


        <!-- POSTS -->

        <div class="panel">

          <h2>Published Posts</h2>

          <div id="postsContainer">

          </div>

        </div>

      </div>

    </div>

  </div>

</body>
</html>
