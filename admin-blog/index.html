<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Audiory Blog Dashboard</title>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getFirestore,
      collection,
      addDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCmsFTjDryYOTddWfScTKsnrs0cWAHnpdc",
      authDomain: "audiory-beat-store.firebaseapp.com",
      projectId: "audiory-beat-store",
      storageBucket: "audiory-beat-store.firebasestorage.app",
      messagingSenderId: "688272560511",
      appId: "1:688272560511:web:9031e6ce215d6f08764a4a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function publishPost() {
      const title = document.getElementById("title").value;
      const excerpt = document.getElementById("excerpt").value;
      const content = document.getElementById("content").value;

      const slug = title
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-");

      try {

        await addDoc(collection(db, "blogPosts"), {
          title,
          excerpt,
          content,
          slug,
          published: true,
          createdAt: serverTimestamp()
        });

        alert("Post published successfully!");

      } catch (error) {
        console.error(error);
        alert(error.message);
      }
    }

    window.publishPost = publishPost;
  </script>

  <style>

    body{
      background:#050816;
      color:white;
      font-family:Arial;
      padding:20px;
    }

    h1{
      margin-bottom:20px;
    }

    input, textarea{
      width:100%;
      margin-bottom:15px;
      padding:14px;
      border:none;
      border-radius:12px;
      background:#111827;
      color:white;
      font-size:16px;
    }

    textarea{
      min-height:250px;
      resize:vertical;
    }

    button{
      background:white;
      color:black;
      border:none;
      padding:14px 20px;
      border-radius:12px;
      font-weight:bold;
      cursor:pointer;
    }

  </style>
</head>
<body>

  <h1>Publish Blog Post</h1>

  <input
    id="title"
    placeholder="Post title"
  />

  <input
    id="excerpt"
    placeholder="Short excerpt"
  />

  <textarea
    id="content"
    placeholder="Write your article..."
  ></textarea>

  <button onclick="publishPost()">
    Publish Post
  </button>

</body>
</html>
