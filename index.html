<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Audiory Blog</title>

  <script type="module">

    import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getFirestore,
      collection,
      getDocs,
      query,
      orderBy
    }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {

      apiKey: "AIzaSyCmsFTjDryYOTddWfScTKsnrs0cWAHnpdc",

      authDomain: "audiory-beat-store.firebaseapp.com",

      projectId: "audiory-beat-store",

      storageBucket: "audiory-beat-store.firebasestorage.app",

      messagingSenderId: "688272560511",

      appId: "1:688272560511:web:9031e6ce215d6f08764a4a"

    };

    const app = initializeApp(firebaseConfig);

    const db = getFirestore(app);


    async function loadPosts() {

      const container =
        document.getElementById("posts");

      const q = query(
        collection(db, "blogPosts"),
        orderBy("createdAt", "desc")
      );

      const snapshot = await getDocs(q);

      snapshot.forEach((docSnap) => {

        const post = docSnap.data();

        const card = document.createElement("a");

        card.href =
          `post.html?slug=${post.slug}`;

        card.className = "card";

        card.innerHTML = `

          <img
            src="${post.thumbnailURL || ''}"
          />

          <div class="content">

            <h2>${post.title}</h2>

            <p>${post.excerpt || ''}</p>

            <small>
              ${post.authorName || ''}
            </small>

          </div>

        `;

        container.appendChild(card);

      });

    }

    loadPosts();

  </script>

  <style>

    *{
      box-sizing:border-box;
    }

    body{

      margin:0;

      background:#050816;

      color:white;

      font-family:Arial;

    }

    .hero{

      padding:60px 20px;

      text-align:center;

      border-bottom:1px solid #1f2937;

    }

    .hero h1{

      font-size:48px;

      margin-bottom:10px;

    }

    .hero p{

      color:#9ca3af;

    }

    .container{

      max-width:1200px;

      margin:auto;

      padding:30px 20px;

    }

    .grid{

      display:grid;

      grid-template-columns:repeat(auto-fit,minmax(300px,1fr));

      gap:20px;

    }

    .card{

      background:#0f172a;

      border-radius:20px;

      overflow:hidden;

      text-decoration:none;

      color:white;

      border:1px solid #1e293b;

      transition:.2s;

    }

    .card:hover{

      transform:translateY(-4px);

    }

    .card img{

      width:100%;

      height:220px;

      object-fit:cover;

      background:#111827;

    }

    .content{

      padding:20px;

    }

    h2{

      margin-top:0;

    }

    p{

      color:#9ca3af;

    }

  </style>

</head>
<body>

  <div class="hero">

    <h1>Audiory Blog</h1>

    <p>
      Music marketing, beat selling,
      producer tips and industry insights.
    </p>

  </div>

  <div class="container">

    <div class="grid" id="posts">

    </div>

  </div>

</body>
</html>
